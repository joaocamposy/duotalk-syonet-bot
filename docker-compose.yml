version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - SYONET_URL=${SYONET_URL:-https://syonet.exemplo.com.br}
      - SYONET_USER=${SYONET_USER:-usuario}
      - SYONET_PASS=${SYONET_PASS:-senha}
      - QUEUE_DRIVER=${QUEUE_DRIVER:-file}
      - HEADLESS=true
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    profiles:
      - with-redis

volumes:
  redis_data:
