services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - API_TOKEN=${API_TOKEN}
      - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY}
      - QUEUE_ENABLED=${QUEUE_ENABLED:-false}
      - QUEUE_DRIVER=${QUEUE_DRIVER:-file}
      - QUEUE_FILE_PATH=${QUEUE_FILE_PATH:-/app/data/queue.json}
      - QUEUE_CONCURRENCY=${QUEUE_CONCURRENCY:-1}
      - QUEUE_RETRY_BASE_DELAY_MS=${QUEUE_RETRY_BASE_DELAY_MS:-1000}
      - QUEUE_MAX_JOBS=${QUEUE_MAX_JOBS:-1000}
      - DEDUP_WINDOW_MINUTES=${DEDUP_WINDOW_MINUTES:-5}
      - JOB_RETENTION_DAYS=${JOB_RETENTION_DAYS:-7}
      - SYNC_TIMEOUT_MS=${SYNC_TIMEOUT_MS:-60000}
      - SHUTDOWN_TIMEOUT_MS=${SHUTDOWN_TIMEOUT_MS:-30000}
      - SYONET_HTTP_TIMEOUT_MS=${SYONET_HTTP_TIMEOUT_MS:-15000}
      - SYONET_HTTP_MAX_RESPONSE_BYTES=${SYONET_HTTP_MAX_RESPONSE_BYTES:-2097152}
      - SYONET_PROCESS_TIMEOUT_MS=${SYONET_PROCESS_TIMEOUT_MS:-60000}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-100}
      - RATE_LIMIT_TIME_WINDOW=${RATE_LIMIT_TIME_WINDOW:-1 minute}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - queue-data:/app/data
    restart: unless-stopped
    stop_grace_period: 45s

volumes:
  queue-data:
